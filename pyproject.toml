[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gapcourt"
version = "0.0.1"
description = "Gap Court: a policy-grounded decision aid for one public-service journey (hackathon entry, work in progress)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
model = ["anthropic>=2.3,<3"]
http = ["httpx>=0.27"]
pdf = ["pypdfium2>=4"]
prepare = ["pymupdf>=1.24,<2", "beautifulsoup4>=4.12", "lxml>=5", "pypdfium2>=4,<5.13"]
dev = ["pytest>=8", "httpx>=0.27", "anthropic>=2.3,<3", "python-docx>=1.1"]

[project.scripts]
gapcourt = "gapcourt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
